<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Math Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 20px;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
        }
        
        .question {
            margin: 20px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border-left: 4px solid blue;
        }
        
        label {
            display: block;
            margin: 10px 0;
        }
        
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        
        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- START OF MATH TEST -->
<div class="container">
    <h1>Online Math Test</h1>
    
    <form>
        <div class="question">
            <label>Your Name:</label>
            <input type="text" placeholder="Enter your name">
        </div>

        <div class="question">
            <h3>Question 1: What is 5 × 8?</h3>
            <label><input type="radio" name="q1"> 35</label>
            <label><input type="radio" name="q1"> 40</label>
            <label><input type="radio" name="q1"> 45</label>
        </div>

        <div class="question">
            <h3>Question 2: What is 12 ÷ 3?</h3>
            <label><input type="radio" name="q2"> 2</label>
            <label><input type="radio" name="q2"> 4</label>
            <label><input type="radio" name="q2"> 6</label>
        </div>

        <div class="question">
            <h3>Question 3: Solve: 15 − 8 + 3 = ?</h3>
            <label><input type="radio" name="q3"> 8</label>
            <label><input type="radio" name="q3"> 10</label>
            <label><input type="radio" name="q3"> 12</label>
        </div>

        <div class="question">
            <h3>Word Problem:</h3>
            <p>A store has 20 apples. They sell 7. How many are left?</p>
            <label>Your Answer:</label>
            <textarea placeholder="Write your answer here..."></textarea>
        </div>

        <button type="submit">Submit Test</button>
    </form>
</div>
<!-- END OF MATH TEST -->

</body>
</html>
