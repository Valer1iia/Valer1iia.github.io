<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Scheme</title>
<style>
body {
font-family: Arial, sans-serif;
padding: 20px;
}
caption {
font-size: 1.5em;
font-weight: bold;
font-style: italic;
margin-bottom: 15px;
color: #333;
text-transform: uppercase;
letter-spacing: 1px;
}
table {
border-collapse: collapse;
width: 100%;
max-width: 800px;
margin: 0 auto;
}
th, td {
border: 1px solid #333;
padding: 12px;
text-align: center;
}
.color-name {
font-weight: bold;
color: #fff;
text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<table>
<caption>Color Scheme: Sunset Over the Ocean</caption>
<thead>
<tr>
<th class="color-name" style="background-color: #FF7F50;">Coral</th>
<th class="color-name" style="background-color: #1E3A8A;">Dark Blue</th>
<th class="color-name" style="background-color: #FFD700;">Golden</th>
<th class="color-name" style="background-color: #6B21A8;">Purple</th>
</tr>
</thead>
<tbody>
<tr>
<td>#FF7F50</td>
<td>#1E3A8A</td>
<td>#FFD700</td>
<td>#6B21A8</td>
</tr>
<tr>
<td>rgb(255, 127, 80)</td>
<td>rgb(30, 58, 138)</td>
<td>rgb(255, 215, 0)</td>
<td>rgb(107, 33, 168)</td>
</tr>
<tr>
<td>hsl(16, 100%, 66%)</td>
<td>hsl(224, 64%, 33%)</td>
<td>hsl(51, 100%, 50%)</td>
<td>hsl(273, 67%, 39%)</td>
</tr>
</tbody>
</table>

</body>
</html>
